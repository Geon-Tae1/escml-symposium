<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>준비 일정표 — 선양국 교수님 정년퇴임 기념 심포지엄</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="base.css?v=1">
<link rel="stylesheet" href="styles.css?v=2">
</head>
<body data-page="schedule">
<div id="site-header"></div>
<main>

<div class="page-head"><div class="strata"></div><div class="wrap page-head-in reveal">
  <div class="eyebrow">준비 일정표</div>
  <h1>무엇을 언제까지 해야 하는가</h1>
  <p>예약도 제작도 공지도 전부 날짜에 매여 있습니다. 날짜를 못 박는 일이 가장 급합니다.</p>
</div></div>

<section class="section"><div class="wrap">
  <div id="steps" class="steps"></div>
</div></section>

</main>
<div id="site-footer"></div>
<script defer src="data.js?v=2"></script>
<script defer src="app.js?v=2"></script>
<script>
window.addEventListener('DOMContentLoaded', function () {
  var D = window.SYM, el = window.SYMUI.el, box = document.getElementById('steps');
  if (!D || !box) return;
  D.steps.forEach(function (s) {
    box.appendChild(el('div', { class: 'step reveal in' + (s.done ? ' done' : '') }, [
      el('div', { class: 'ph' }, [s.phase]),
      el('h3', {}, [s.title]),
      el('div', { class: 'due' }, ['기한 ' + s.due]),
      el('p', {}, [s.detail]),
      s.note ? el('div', { class: 'note' }, [s.note]) : null,
      el('span', { class: 'chk' }, [s.done ? '완료' : '진행 전'])
    ]));
  });
});
</script>
</body>
</html>
