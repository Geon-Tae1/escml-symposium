<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>프로그램 아이디어 — 선양국 교수님 정년퇴임 기념 심포지엄</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="base.css?v=1">
<link rel="stylesheet" href="styles.css?v=3">
</head>
<body data-page="program">
<div id="site-header"></div>
<main>

<div class="page-head"><div class="strata"></div><div class="wrap page-head-in reveal">
  <div class="eyebrow">프로그램</div>
  <h1>이런 자리를 생각하고 있습니다</h1>
  <p>확정된 것은 아직 없습니다. 아래는 출발점으로 적어 둔 안이고,
     더 좋은 생각이 있으시면 알려 주시면 이 목록에 넣겠습니다.</p>
</div></div>

<section class="section"><div class="wrap">
  <div class="ideas" id="ideas"></div>
  <div class="callout reveal" style="margin-top:26px">
    <h3>아이디어를 보내 주세요</h3>
    <p>맡아 주실 수 있는 역할이 있거나, 꼭 넣었으면 하는 순서가 있으면
       <a href="mailto:gtpark1@hanyang.ac.kr?subject=%ED%87%B4%EC%9E%84%20%EC%8B%AC%ED%8F%AC%EC%A7%80%EC%97%84%20%ED%94%84%EB%A1%9C%EA%B7%B8%EB%9E%A8%20%EC%A0%9C%EC%95%88">gtpark1@hanyang.ac.kr</a>
       로 알려 주십시오. 보내 주신 분 이름과 함께 올리겠습니다.</p>
  </div>
</div></section>

</main>
<div id="site-footer"></div>
<script defer src="data.js?v=3"></script>
<script defer src="app.js?v=3"></script>
<script>
window.addEventListener('DOMContentLoaded', function () {
  var D = window.SYM, el = window.SYMUI.el, box = document.getElementById('ideas');
  if (!D || !box) return;
  D.ideas.forEach(function (it, i) {
    box.appendChild(el('div', { class: 'idea reveal in' }, [
      el('div', { class: 'no' }, [String(i + 1).padStart(2, '0')]),
      el('div', { class: 'cat' }, [it.cat]),
      el('h3', {}, [it.title]),
      el('p', {}, [it.detail]),
      el('div', { class: 'who' }, [
        it.who ? el('span', {}, ['맡을 사람 · ' + it.who]) : null,
        it.time ? el('span', {}, ['소요 · ' + it.time]) : null,
        it.by ? el('span', {}, ['제안 · ' + it.by]) : null
      ])
    ]));
  });
});
</script>
</body>
</html>
